<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101d"><title>東北ワカサギ占い</title><link rel="stylesheet" href="style.css"></head><body>
<div class="veil"></div><div class="app-shell">
<header class="hero"><div class="compass">✦</div><p class="eyebrow">TOHOKU WAKASAGI ORACLE</p><h1>東北ワカサギ占い</h1><div class="ornament"><span></span><b>厳冬の神託</b><span></span></div><p>釣りに行く日の神託を引こう。</p></header>
<main class="layout">
<section class="panel form-panel"><h2>❄ 神託を始める ❄</h2><form id="fortune-form"><label><span>▣ 釣行日</span><input type="date" id="tripDate" required></label><label><span>⌖ 場所・釣りスタイル</span><select id="location" required></select></label><label><span>✦ モード</span><select id="mode"><option value="normal">NORMAL</option><option value="hard">HARD</option><option value="oni">鬼HARD</option></select></label><button class="primary-btn" type="submit">✦ カードを引く ✦</button></form><small>天候・風・気温は結果画面に表示</small><button class="gallery-btn" id="galleryBtn" type="button">22枚のカードを見る</button></section>
<section class="panel result-panel"><div class="empty-state" id="emptyState"><div class="card-placeholder">✧<b>?</b>✧</div><h2>今日の神託を待っています</h2><p>日付と釣り場を選んで、カードを引いてください。</p></div>
<div class="result hidden" id="resultContent"><div class="result-head"><div class="result-place"><p class="result-kicker">本日の神託</p><h2 id="resultLocation"></h2><p id="resultMeta"></p></div><div class="weather-summary"><h3>今日の湖上</h3><div class="weather-chip" id="weatherCondition"></div><div class="weather-grid"><div><span>気温</span><strong id="weatherTemp"></strong></div><div><span>風</span><strong id="weatherWind"></strong></div></div></div></div><div class="season-alert" id="seasonAlert"></div>
<div class="card-section"><div class="tarot-card" id="tarotCard"><img id="tarotImage" alt=""><div class="rank-corner" id="tarotRankBadge"></div></div><div class="oracle-column"><div class="rank-plaque"><span class="rank-disc" id="rankDisc">A</span><span><small>RANK</small><b id="rankMetal">SILVER</b></span></div><div class="card-title"><span id="tarotNumber"></span><b id="tarotName"></b></div><div class="oracle-copy"><h3>本日の神託</h3><p id="oracleText"></p><em id="tarotTagline"></em></div></div></div>
<div class="section-title"><span></span><b>本日の導き</b><span></span></div><div class="guidance-grid"><div class="guide-card"><i>≋</i><span>棚</span><strong id="guideShelf"></strong></div><div class="guide-card"><i>⌁</i><span>仕掛け</span><strong id="guideRig"></strong></div><div class="guide-card"><i>●</i><span>オモリ</span><strong id="guideSinker"></strong></div><div class="guide-card"><i>◉</i><span>餌</span><strong id="guideBait"></strong></div><div class="guide-card"><i>╱</i><span>穂先</span><strong id="guideTip"></strong></div></div>
<div class="catch-section"><div class="catch-main"><p>今日の本命</p><h3 id="catchMain"></h3><small id="catchRange"></small><div class="fish-line">𓆝 𓆟 𓆞</div></div><div class="catch-note"><h4>時合い・釣果の気配</h4><div class="stars" id="stars">★ ★ ★ ★ ☆</div><p id="catchText"></p></div></div><div class="bottom-grid"><div class="info-box"><h4>✦ ラッキーアイテム ✦</h4><p id="luckyItem"></p></div><div class="info-box"><h4>現地ワンポイント</h4><p id="localTip"></p></div></div><button class="again-btn" onclick="document.getElementById('fortune-form').requestSubmit()">❄ もう一度占う ❄</button></div></section></main>
<section class="gallery panel hidden" id="gallery"><div class="gallery-head"><h2>ワカサギタロット 22枚</h2><button id="closeGallery">閉じる</button></div><div class="gallery-grid" id="galleryGrid"></div></section>
</div><script src="app.js"></script></body></html>
