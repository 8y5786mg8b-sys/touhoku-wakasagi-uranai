<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>東北ワカサギ占い</title>
<link rel="stylesheet" href="style.css?v=clean2">
</head>
<body>
<div class="app-shell">
<header class="hero">
<div class="hero-mark">✦</div>
<p class="eyebrow">TOHOKU WAKASAGI ORACLE</p>
<h1>東北ワカサギ占い</h1>
<p class="lead">実釣データ × 天気 × ワカサギタロット</p>
</header>
<main class="layout">
<section class="panel controls">
<h2>❄ 神託を始める ❄</h2>
<form id="fortuneForm">
<label>釣行日<input id="tripDate" type="date" required></label>
<label>場所・釣りスタイル<select id="location" required></select></label>
<label>モード<select id="mode"><option value="normal">NORMAL</option><option value="hard">HARD</option><option value="oni">鬼HARD</option></select></label>
<button class="primary" type="submit">✦ カードを引く ✦</button>
</form>
<button class="secondary" id="galleryBtn" type="button">22枚のカードを見る</button>
<p class="tiny">カード画像はすべて <code>assets/tarot/</code> の固定ファイルを直接参照します。</p>
</section>
<section class="panel result-panel">
<div id="emptyState" class="empty-state"><div class="placeholder">?</div><h2>今日の神託を待っています</h2><p>日付と釣り場を選んでカードを引いてください。</p></div>
<div id="result" class="hidden">
<div class="result-head"><div><p class="eyebrow">本日の神託</p><h2 id="resultLocation"></h2><p id="resultMeta"></p></div><div class="weather"><span id="weatherText">天気確認中</span><strong id="weatherNumbers">--</strong></div></div>
<div class="card-layout"><figure class="tarot-frame"><img id="tarotImage" alt=""></figure><div class="oracle"><div class="card-title"><span id="tarotNumber"></span><strong id="tarotName"></strong></div><p id="oracleText"></p><em id="tagline"></em></div></div>
<div class="guidance"><div><span>棚</span><strong id="shelf"></strong></div><div><span>仕掛け</span><strong id="rig"></strong></div><div><span>オモリ</span><strong id="sinker"></strong></div><div><span>餌</span><strong id="bait"></strong></div><div><span>穂先</span><strong id="tip"></strong></div></div>
<div class="catch"><div><span>予想釣果</span><strong id="catchRange"></strong></div><p id="localTip"></p></div>
<button class="secondary" id="againBtn" type="button">もう一度占う</button>
</div>
</section>
</main>
<section class="panel gallery hidden" id="gallery"><div class="gallery-head"><div><p class="eyebrow">WAKASAGI TAROT</p><h2>ワカサギタロット 22枚</h2></div><button id="closeGallery" type="button">閉じる</button></div><p id="galleryStatus" class="status">22枚を検証中…</p><div id="galleryGrid" class="gallery-grid"></div></section>
</div>
<script src="app.js?v=clean2"></script>
</body>
</html>
